# Keep MIN_IOS_BUILD_NUMBER moving forward on every merge to main.
# Codemagic still prefers App Store Connect latest+1 at build time; this floor is
# the repo-side watermark / fallback if ASC lookup fails.
name: Bump MIN_IOS_BUILD_NUMBER on main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-min-ios-on-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Avoid loops: skip our own bump commits and explicit no-bump markers.
    if: >
      github.event.head_commit != null &&
      !contains(github.event.head_commit.message, 'chore(ios): auto-bump MIN_IOS_BUILD_NUMBER') &&
      !contains(github.event.head_commit.message, '[skip min-ios-bump]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this push already bumped the floor
        id: need_bump
        run: |
          set -euo pipefail
          # Range: before → after for this push (merge commits included).
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "need=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff "$BEFORE" HEAD -- codemagic.yaml | grep -q 'MIN_IOS_BUILD_NUMBER'; then
            echo "Push already changed MIN_IOS_BUILD_NUMBER — skipping bot bump"
            echo "need=false" >> "$GITHUB_OUTPUT"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump floor +1
        if: steps.need_bump.outputs.need == 'true'
        run: |
          set -euo pipefail
          chmod +x ./scripts/bump-min-ios-build-number.sh
          ./scripts/bump-min-ios-build-number.sh

      - name: Commit and push
        if: steps.need_bump.outputs.need == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codemagic.yaml docs/00-PROJECT-STATUS.md docs/STORE-DEPLOY.md
          if git diff --staged --quiet; then
            echo "No floor changes to commit"
            exit 0
          fi
          git commit -m "chore(ios): auto-bump MIN_IOS_BUILD_NUMBER"
          git push origin HEAD:main
