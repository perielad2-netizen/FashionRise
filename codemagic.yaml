# FashionRise — Codemagic iOS IPA workflow (Capacitor)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-an-ionic-app/
#       https://docs.codemagic.io/yaml-publishing/app-store-connect/
#
# Manual start only (no triggering:). Uploads the IPA to App Store Connect
# via the "codemagic access" integration. Does NOT submit TestFlight beta
# review, App Store review, or auto-distribute to beta groups.
# Signing materials live in Codemagic (Team integrations + Code signing
# identities), not in GitHub secrets.
#
# Verified from this repo (do not rename casually):
#   working_directory: web-ui
#   Xcode workspace:  web-ui/ios/App/App.xcworkspace
#   Xcode scheme:     App  (PBXNativeTarget "App")
#   Bundle ID:        app.fashionrise.studio
#   Native web build: npm run build:native  (.env.native absolute API)

workflows:
  fashionrise-ios-app-store:
    name: FashionRise iOS (App Store IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: web-ui

    # Must match the Apple Developer Portal integration name in Codemagic
    # (Team settings → Team integrations → Developer Portal).
    integrations:
      app_store_connect: "codemagic access"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.fashionrise.studio
      groups:
        # Create in Codemagic → Environment variables (group).
        # Required for production-gated web build asserts:
        #   VITE_MY_CROQUIS_ADULTS_NOTICE_TEXT
        #   VITE_MY_CROQUIS_STORAGE_NOTICE_TEXT
        #   VITE_MY_CROQUIS_AI_NOTICE_TEXT
        # (same approved copy / SHA256 as production web builds)
        - fashionrise_native
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # App Store Connect → App → General → App Information → Apple ID
        APP_STORE_APPLE_ID: "6832116469"
        BUNDLE_ID: app.fashionrise.studio
        # ASC CFBundleVersion floor (not marketing version 1.0).
        # IPA stamp = max(Codemagic BUILD_NUMBER, this floor). Never reuse an ASC build.
        MIN_IOS_BUILD_NUMBER: "12"
      node: 22
      xcode: 26.5
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build native web bundle (Capacitor dist/)
        script: |
          # Uses committed .env.native (absolute https://fashionrise.app/api/v1).
          # Croquis notice texts must come from the fashionrise_native env group.
          export VITE_BUILD_SHA="${CM_COMMIT:0:8}"
          npm run build:native

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/web-ui/ios/App"
          # Prefer Codemagic's workflow BUILD_NUMBER, but never go below the floor
          # (ASC uniqueness for CFBundleVersion).
          CANDIDATE="${BUILD_NUMBER:-0}"
          FLOOR="${MIN_IOS_BUILD_NUMBER:-12}"
          if [ "$CANDIDATE" -lt "$FLOOR" ]; then
            CANDIDATE="$FLOOR"
          fi
          echo "CFBundleVersion candidate=$CANDIDATE (BUILD_NUMBER=${BUILD_NUMBER:-unset} floor=$FLOOR)"
          agvtool new-version -all "$CANDIDATE"

      - name: Build App Store IPA
        script: |
          cd "$CM_BUILD_DIR/web-ui/ios/App"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Verify App.ipa exists for artifacts
        script: |
          # build-ipa writes next to the Xcode project (not under working_directory alone).
          IPA_PATH="$CM_BUILD_DIR/web-ui/ios/App/build/ios/ipa/App.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: App.ipa missing after build-ipa"
            echo "expected=$IPA_PATH"
            ls -la "$CM_BUILD_DIR/web-ui/ios/App/build/ios/ipa" 2>/dev/null || true
            find "$CM_BUILD_DIR/web-ui/ios/App" -name '*.ipa' 2>/dev/null || true
            exit 1
          fi
          # macOS builders use BSD stat; GNU stat is the Linux fallback.
          SIZE="$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")"
          if [ -z "$SIZE" ] || [ "$SIZE" -le 0 ]; then
            echo "ERROR: App.ipa is empty (size=${SIZE:-unknown}) at $IPA_PATH"
            exit 1
          fi
          echo "OK: App.ipa ready for Codemagic artifacts"
          echo "IPA_PATH=$IPA_PATH"
          echo "IPA_SIZE_BYTES=$SIZE"
          ls -lh "$IPA_PATH"
          # CM_EXPORT_DIR is always collected; also stage a clone-root copy for globs.
          mkdir -p "$CM_EXPORT_DIR" "$CM_BUILD_DIR/codemagic-artifacts"
          cp -f "$IPA_PATH" "$CM_EXPORT_DIR/App.ipa"
          cp -f "$IPA_PATH" "$CM_BUILD_DIR/codemagic-artifacts/App.ipa"

    artifacts:
      # Artifact patterns are relative to the clone directory ($CM_BUILD_DIR), but
      # with working_directory: web-ui the clone-relative "web-ui/..." glob failed to
      # surface App.ipa on build #4 even though Export Succeeded. Prefer absolute
      # paths + CM_EXPORT_DIR / clone-root staging from the verify step.
      - $CM_BUILD_DIR/web-ui/ios/App/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/codemagic-artifacts/*.ipa
      - $CM_EXPORT_DIR/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # Upload IPA to App Store Connect only (TestFlight processing). No beta review,
    # no App Store review, no beta_groups — distribute manually in ASC if needed.
    # Docs: https://docs.codemagic.io/yaml-publishing/app-store-connect/
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
