# FashionRise — Codemagic native workflows (Capacitor)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-an-ionic-app/
#       https://docs.codemagic.io/yaml-publishing/app-store-connect/
#       https://docs.codemagic.io/yaml-code-signing/signing-android/
#       https://docs.codemagic.io/yaml-publishing/publishing-to-google-play/
#       https://docs.codemagic.io/knowledge-codemagic/build-versioning/
#       https://docs.codemagic.io/yaml-basic-configuration/environment-variables/
#       https://docs.codemagic.io/troubleshooting/accessing-builder-machine-via-ssh/
#       https://docs.codemagic.io/yaml-code-signing/ios-simulator-builds/
#
# Manual start only (no triggering:).
# - fashionrise-ios-app-store: App Store IPA → ASC (no review submit)
# - fashionrise-ipad-screenshots: simulator .app + VNC iPad screenshot session
#   (NO IPA publish, NO ASC, NO IAP gate changes)
# - fashionrise-android-play-internal: signed Play AAB artifact (internal testing)
#   (NO production track submit; upload/manual distribute in Play Console)
# Signing materials live in Codemagic (Team integrations + Code signing
# identities), not in GitHub secrets.
#
# Verified from this repo (do not rename casually):
#   working_directory: web-ui
#   Xcode workspace:  web-ui/ios/App/App.xcworkspace
#   Xcode scheme:     App  (PBXNativeTarget "App")
#   Bundle ID:        app.fashionrise.studio
#   Native web build: npm run build:native  (.env.native absolute API)
#
# 90189 / Redundant Binary Upload lessons:
#   1) app-store-connect publish defaults to **/*.ipa — multiple staged App.ipa
#      copies caused the same CFBundleVersion to upload twice in one run
#      (first OK in ASC, second → 90189). Collect exactly ONE IPA artifact.
#   2) CFBundleVersion = PROJECT_BUILD_NUMBER + offset (monotonic).
#      If ASC_latest >= that stamp, fail closed and raise the offset — do not
#      stamp ASC_latest+1 alone (stale API can repeat). No sticky MIN floor.

workflows:
  fashionrise-ios-app-store:
    name: FashionRise iOS (App Store IPA)
    max_build_duration: 120
    # Paid plan: Mac mini M4 (10-core / 16GB) — faster than mac_mini_m2.
    # Studio M4 Max is invite-only via Codemagic support (no public YAML key).
    instance_type: mac_mini_m4
    working_directory: web-ui

    # Must match the Apple Developer Portal integration name in Codemagic
    # (Team settings → Team integrations → Developer Portal).
    integrations:
      app_store_connect: "codemagic access"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.fashionrise.studio
      groups:
        # Create in Codemagic → Environment variables (group).
        # Required for production-gated web build asserts:
        #   VITE_MY_CROQUIS_ADULTS_NOTICE_TEXT
        #   VITE_MY_CROQUIS_STORAGE_NOTICE_TEXT
        #   VITE_MY_CROQUIS_AI_NOTICE_TEXT
        # (same approved copy / SHA256 as production web builds)
        - fashionrise_native
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # App Store Connect → App → General → App Information → Apple ID
        APP_STORE_APPLE_ID: "6832116469"
        BUNDLE_ID: app.fashionrise.studio
        # CFBundleVersion = PROJECT_BUILD_NUMBER + OFFSET (fail closed if ASC is ahead).
        # Offset keeps early Codemagic counters above already-used ASC builds
        # (1.0 has used through ~20). Marketing 1.0 train is CLOSED in ASC
        # (upload error 90186) — use 1.0.1 for new TestFlight / App Store builds.
        IOS_BUILD_NUMBER_OFFSET: "100"
        IOS_MARKETING_VERSION: "1.0.1"
        EXPECTED_IOS_MARKETING_VERSION: "1.0.1"

      node: 22
      # Stay on Xcode 26.5 until Capacitor ≥8.5 UIScene migration.
      # Xcode 27 / iOS 27 SDK kills launch on iOS 27 without UIApplicationSceneManifest
      # (`_UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption`) — Cap 7.x
      # has no SceneDelegateProxy. Apple ITMS-90725 (Xcode 27+) is Apr 2027.
      # Codemagic: https://docs.codemagic.io/specs-macos/xcode-26-5/
      xcode: 26.5
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build native web bundle (Capacitor dist/)
        script: |
          # Uses committed .env.native (absolute https://fashionrise.app/api/v1).
          # Croquis notice texts must come from the fashionrise_native env group.
          export VITE_BUILD_SHA="${CM_COMMIT:0:8}"
          npm run build:native

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
          # Fail closed: committed Cap gitignore means native JSON is generated at sync.
          # Rewrite/assert contentInset never so TestFlight never double-pads under status bar.
          node scripts/assert-ios-capacitor-content-inset.mjs

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
          # Surface profile / entitlement mismatches early (Push + Associated Domains).
          echo "=== Signing dump (App target Release) ==="
          xcodebuild -workspace "$CM_BUILD_DIR/web-ui/ios/App/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -showBuildSettings 2>/dev/null | \
            grep -E 'CODE_SIGN_|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS' || true
          echo "=== Release entitlements ==="
          cat "$CM_BUILD_DIR/web-ui/ios/App/App/AppRelease.entitlements" || true

      - name: Set build number
        script: |
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-set-ios-build-number.sh"
          "$CM_BUILD_DIR/scripts/codemagic-set-ios-build-number.sh"

      - name: Assert iOS AppIcon is real (not blank white)
        script: |
          # working_directory is web-ui — npm script resolves
          # web-ui/scripts/assert-ios-appicon.mjs (not repo-root scripts/).
          # Purchase sheet uses the compiled Xcode AppIcon asset catalog.
          # A solid-white 1024 PNG still "builds" but Apple shows a placeholder.
          # Fail closed: pixel scan via @napi-rs/canvas (from npm ci), sharp, or
          # Pillow — no size-only pass. Do not pip-install here; rely on npm ci.
          npm run check:ios-appicon

      - name: Build App Store IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/web-ui/ios/App"
          mkdir -p /tmp/xcodebuild_logs
          ARCHIVE_LOG=/tmp/xcodebuild_logs/archive_raw.log
          # Force Manual signing on the archive so CocoaPods/XCFrameworks do not
          # keep Automatic development signing and fail archive (exit 65).
          # Tee raw xcodebuild output — Codemagic's default xcpretty often drops
          # the real "error:" lines (profile/entitlement mismatches).
          set +e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual" \
            2>&1 | tee "$ARCHIVE_LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: build-ipa failed with exit=$STATUS — dumping xcodebuild errors"
            echo "----- error: lines from $ARCHIVE_LOG -----"
            grep -E 'error:|fatal error:|Code Sign|Provisioning|entitlement|FAILED|❌|errSec|No profiles' "$ARCHIVE_LOG" | tail -n 120 || true
            echo "----- last 150 lines of $ARCHIVE_LOG -----"
            tail -n 150 "$ARCHIVE_LOG" || true
            find /tmp/xcodebuild_logs "$HOME/Library/Logs/gym" "$HOME/Library/Developer/Xcode/DerivedData" \
              -type f \( -name '*.log' -o -name '*-bundle.log' \) 2>/dev/null \
              | head -n 20 \
              | while read -r f; do
                  [ "$f" = "$ARCHIVE_LOG" ] && continue
                  echo "----- $f -----"
                  grep -E 'error:|fatal error:|Code Sign|Provisioning|entitlement|FAILED|❌' "$f" | tail -n 40 || true
                done
            exit "$STATUS"
          fi

      - name: Verify single App.ipa + CFBundleVersion
        script: |
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-verify-ios-ipa.sh"
          # Do NOT copy App.ipa into CM_EXPORT_DIR or other staging dirs —
          # ASC publish discovers **/*.ipa and would upload duplicates (90189).
          "$CM_BUILD_DIR/scripts/codemagic-verify-ios-ipa.sh" \
            "$CM_BUILD_DIR/web-ui/ios/App/build/ios/ipa/App.ipa"

    artifacts:
      # Exactly ONE publishable IPA. Prefer the verified absolute original path.
      # Do not also list CM_EXPORT_DIR / staging copies (duplicate → 90189).
      - $CM_BUILD_DIR/web-ui/ios/App/build/ios/ipa/App.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # Upload IPA to App Store Connect only (TestFlight processing). No beta review,
    # no App Store review, no beta_groups — distribute manually in ASC if needed.
    # Docs: https://docs.codemagic.io/yaml-publishing/app-store-connect/
    # CLI publish default path is **/*.ipa — keep a single App.ipa on disk.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # ---------------------------------------------------------------------------
  # Manual iPad Simulator screenshots via Codemagic remote Mac + VNC (Windows OK).
  # Does NOT build/publish an IPA. Does NOT touch App Store Connect or IAP gates.
  # Operator docs: docs/deploy/IPAD-SCREENSHOTS-CODEMAGIC.md
  # ---------------------------------------------------------------------------
  fashionrise-ipad-screenshots:
    name: FashionRise iPad Screenshots
    max_build_duration: 120
    # Same paid Mac mini M4 as App Store IPA (Xcode / simulator need macOS).
    instance_type: mac_mini_m4
    working_directory: web-ui
    # No app_store_connect integration — screenshot session only.

    environment:
      groups:
        # Same croquis notice texts as native / production-gated builds.
        - fashionrise_native
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: app.fashionrise.studio
        # Bounded VNC hold after boot/install/launch. Prefer fr-ipad-finish
        # (successful Artifacts publish) over canceling the build.
        FR_IPAD_SCREENSHOT_HOLD_MINUTES: "45"
        # Stable DerivedData so we can locate App.app without globbing ASC IPA paths.
        FR_SIM_DERIVED_DATA: /tmp/fr-ipad-sim-derived
      node: 22
      # Match App Store IPA workflow — Xcode 26.5 until Cap UIScene migration.
      xcode: 26.5
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build native web bundle (Capacitor dist/)
        script: |
          # Production API via committed .env.native (https://fashionrise.app/api/v1).
          # Never print tokens / passwords. Croquis notices from fashionrise_native.
          export VITE_BUILD_SHA="${CM_COMMIT:0:8}"
          npm run build:native

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
          node scripts/assert-ios-capacitor-content-inset.mjs

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Assert iOS AppIcon is real (not blank white)
        script: |
          npm run check:ios-appicon

      - name: Assert iPhone+iPad device family preserved
        script: |
          # TARGETED_DEVICE_FAMILY must stay "1,2" (iPhone + iPad).
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' ios/App/App.xcodeproj/project.pbxproj

      - name: Build unsigned simulator .app
        script: |
          set -euo pipefail
          rm -rf "$FR_SIM_DERIVED_DATA"
          mkdir -p "$FR_SIM_DERIVED_DATA"
          cd "$CM_BUILD_DIR/web-ui/ios/App"
          # Prefer a 13-inch iPad destination when Xcode already knows one; build
          # still targets generic iOS Simulator SDK so install works on the
          # dynamically selected device below.
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$FR_SIM_DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH="$(find "$FR_SIM_DERIVED_DATA/Build/Products" -type d -name 'App.app' | head -n 1)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "FR_SIMULATOR_APP_PATH=$APP_PATH" >> "$CM_ENV"
          echo "Built simulator app at $APP_PATH"
          # Never print secrets from the bundle; only confirm Info.plist identity.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist"

      - name: Boot iPad, launch FashionRise, hold for VNC screenshots
        script: |
          set -euo pipefail
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-pick-ipad-simulator.sh"
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-ipad-screenshot.sh"
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-ipad-screenshots-session.sh"
          export FR_IPAD_SCREENSHOT_DIR="$CM_BUILD_DIR/artifacts/ipad-screenshots"
          mkdir -p "$FR_IPAD_SCREENSHOT_DIR" "$CM_EXPORT_DIR/ipad-screenshots"
          "$CM_BUILD_DIR/scripts/codemagic-ipad-screenshots-session.sh"

    artifacts:
      # Screenshots (primary deliverable) + simulator .app for local debug if needed.
      - $CM_BUILD_DIR/artifacts/ipad-screenshots/*.png
      - $CM_EXPORT_DIR/ipad-screenshots/*.png
      - $CM_BUILD_DIR/artifacts/ipad-screenshots/**
      - /tmp/fr-ipad-sim-derived/Build/Products/**/*.app
      - /tmp/xcodebuild_logs/*.log
    # Explicitly no publishing: block — do not upload IPA / change ASC.

  # ---------------------------------------------------------------------------
  # Manual Google Play internal-testing AAB (signed). Does NOT change iOS / web.
  # Operator: Codemagic → Code signing identities → upload keystore as
  # reference name fashionrise_android_upload. Env group fashionrise_native
  # must include the same croquis notice texts as iOS / production web.
  # ---------------------------------------------------------------------------
  fashionrise-android-play-internal:
    name: FashionRise Android (Play AAB)
    max_build_duration: 120
    # Linux builder for Android AAB (iOS workflows use mac_mini_m4).
    instance_type: linux_x2
    working_directory: web-ui

    environment:
      android_signing:
        # Must match Codemagic → Code signing identities → Android keystores
        # → Reference name for the FashionRise upload keystore.
        - fashionrise_android_upload
      groups:
        - fashionrise_native
      vars:
        GOOGLE_PLAY_PACKAGE_NAME: app.fashionrise.studio
        ANDROID_VERSION_NAME: "1.0"
        # versionCode = PROJECT_BUILD_NUMBER + OFFSET (raise if Play latest ≥ stamp).
        # Raise when Play Internal already consumed lower versionCodes from prior AABs.
        # Bumped for camera-permission P0 (#CAMERA tools:node=remove) — next Internal
        # AAB must exceed any APK/AAB still declaring android.permission.CAMERA.
        # Raised so stamp > Play Alpha versionCode 114 and Internal/sideload 145.
        # versionCode = PROJECT_BUILD_NUMBER + OFFSET; fail-closed if ≤ Play latest.
        # Prior Internal/sideload consumed through versionCode 167 — keep stamp above.
        # Prior Internal VC 219 (build index/project + offset 120). Next stamp must be >219.
        # Prior Internal VC 230 (offset 130). Tap-open fix AAB must be >230.
        # Prior Internal VC 241 (offset 140). Friend-alerts FE AAB must be >241.
        ANDROID_VERSION_CODE_OFFSET: "150"
      node: 22
      java: 21

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build native web bundle (Capacitor dist/)
        script: |
          # Committed .env.native → https://fashionrise.app/api/v1
          # Croquis notices from fashionrise_native (same as iOS / prod web).
          export VITE_BUILD_SHA="${CM_COMMIT:0:8}"
          npm run build:native

      - name: Sync Capacitor Android project
        script: |
          npx cap sync android

      - name: Inject google-services.json (Firebase)
        script: |
          set -euo pipefail
          DEST="$CM_BUILD_DIR/web-ui/android/app/google-services.json"
          # Cursor secret name: ANDROID_GOOGLE_SERVICES_JSON (client config only — no private keys).
          # Prefer secure file CM_GOOGLE_SERVICES_JSON, else env ANDROID_GOOGLE_SERVICES_JSON
          # or legacy GOOGLE_SERVICES_JSON from Codemagic group fashionrise_native.
          if [ -n "${CM_GOOGLE_SERVICES_JSON:-}" ] && [ -f "$CM_GOOGLE_SERVICES_JSON" ]; then
            cp "$CM_GOOGLE_SERVICES_JSON" "$DEST"
          elif [ -n "${ANDROID_GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$ANDROID_GOOGLE_SERVICES_JSON" > "$DEST"
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > "$DEST"
          else
            echo "ERROR: google-services.json missing — set ANDROID_GOOGLE_SERVICES_JSON (or CM_GOOGLE_SERVICES_JSON) in fashionrise_native"
            exit 1
          fi
          FR_GS_DEST="$DEST" python3 - <<'PY'
          import json, os
          from pathlib import Path
          dest = Path(os.environ["FR_GS_DEST"])
          data = json.loads(dest.read_text(encoding="utf-8"))
          blob = json.dumps(data)
          if "BEGIN PRIVATE KEY" in blob or data.get("private_key"):
              raise SystemExit("Refusing google-services.json that contains a private key")
          pkg = None
          for c in data.get("client") or []:
              pkg = ((c.get("client_info") or {}).get("android_client_info") or {}).get("package_name")
              if pkg:
                  break
          project = (data.get("project_info") or {}).get("project_id")
          if project != "fashionrise-e2f01":
              raise SystemExit(f"Unexpected Firebase project_id: {project!r}")
          if pkg != "app.fashionrise.studio":
              raise SystemExit(f"Unexpected Android package: {pkg!r}")
          print("google-services.json ok project=", project, "package=", pkg)
          PY
          # Keep until bundleRelease; remove after AAB so it is not exported as an artifact.

      - name: Assert Android launcher icons are real
        script: |
          # Pixel scan in assert-android-appicon.mjs requires Pillow on the builder.
          python3 -m pip install --user --quiet pillow
          npm run check:android-appicon

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/web-ui/android/local.properties"

      - name: Set versionCode / versionName
        script: |
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-set-android-version-code.sh"
          "$CM_BUILD_DIR/scripts/codemagic-set-android-version-code.sh"

      - name: Build signed Play App Bundle (AAB)
        script: |
          set -euo pipefail
          test -n "${CM_KEYSTORE_PATH:-}"
          test -f "$CM_KEYSTORE_PATH"
          test -n "${ANDROID_SDK_ROOT:-}"
          VC="$(cat /tmp/fr-android-version-code.txt)"
          VN="$(cat /tmp/fr-android-version-name.txt)"
          cd "$CM_BUILD_DIR/web-ui/android"
          # mac_mini_m2 checkout may drop the executable bit on the wrapper.
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -PversionCode="$VC" \
            -PversionName="$VN"
          AAB="$CM_BUILD_DIR/web-ui/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          echo "Built AAB: $AAB (versionCode=$VC versionName=$VN package=$GOOGLE_PLAY_PACKAGE_NAME)"
          # Ensure Firebase config never ships in exported mapping/artifacts as a copy.
          rm -f "$CM_BUILD_DIR/web-ui/android/app/google-services.json" || true

    artifacts:
      - $CM_BUILD_DIR/web-ui/android/app/build/outputs/bundle/release/*.aab
      - $CM_BUILD_DIR/web-ui/android/app/build/outputs/**/mapping.txt
    # No google_play publishing block — upload the AAB manually to Play Console
    # Internal testing until a Play API service account is wired in Codemagic.
