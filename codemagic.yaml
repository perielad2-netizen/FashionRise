# FashionRise — Codemagic iOS workflows (Capacitor)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-an-ionic-app/
#       https://docs.codemagic.io/yaml-publishing/app-store-connect/
#       https://docs.codemagic.io/knowledge-codemagic/build-versioning/
#       https://docs.codemagic.io/yaml-basic-configuration/environment-variables/
#       https://docs.codemagic.io/troubleshooting/accessing-builder-machine-via-ssh/
#       https://docs.codemagic.io/yaml-code-signing/ios-simulator-builds/
#
# Manual start only (no triggering:).
# - fashionrise-ios-app-store: App Store IPA → ASC (no review submit)
# - fashionrise-ipad-screenshots: simulator .app + VNC iPad screenshot session
#   (NO IPA publish, NO ASC, NO IAP gate changes)
# Signing materials live in Codemagic (Team integrations + Code signing
# identities), not in GitHub secrets.
#
# Verified from this repo (do not rename casually):
#   working_directory: web-ui
#   Xcode workspace:  web-ui/ios/App/App.xcworkspace
#   Xcode scheme:     App  (PBXNativeTarget "App")
#   Bundle ID:        app.fashionrise.studio
#   Native web build: npm run build:native  (.env.native absolute API)
#
# 90189 / Redundant Binary Upload lessons:
#   1) app-store-connect publish defaults to **/*.ipa — multiple staged App.ipa
#      copies caused the same CFBundleVersion to upload twice in one run
#      (first OK in ASC, second → 90189). Collect exactly ONE IPA artifact.
#   2) CFBundleVersion = PROJECT_BUILD_NUMBER + offset (monotonic).
#      If ASC_latest >= that stamp, fail closed and raise the offset — do not
#      stamp ASC_latest+1 alone (stale API can repeat). No sticky MIN floor.

workflows:
  fashionrise-ios-app-store:
    name: FashionRise iOS (App Store IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: web-ui

    # Must match the Apple Developer Portal integration name in Codemagic
    # (Team settings → Team integrations → Developer Portal).
    integrations:
      app_store_connect: "codemagic access"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.fashionrise.studio
      groups:
        # Create in Codemagic → Environment variables (group).
        # Required for production-gated web build asserts:
        #   VITE_MY_CROQUIS_ADULTS_NOTICE_TEXT
        #   VITE_MY_CROQUIS_STORAGE_NOTICE_TEXT
        #   VITE_MY_CROQUIS_AI_NOTICE_TEXT
        # (same approved copy / SHA256 as production web builds)
        - fashionrise_native
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # App Store Connect → App → General → App Information → Apple ID
        APP_STORE_APPLE_ID: "6832116469"
        BUNDLE_ID: app.fashionrise.studio
        # CFBundleVersion = PROJECT_BUILD_NUMBER + OFFSET (fail closed if ASC is ahead).
        # Offset keeps early Codemagic counters above already-used ASC builds
        # (1.0 has used through ~20). Marketing version stays 1.0.
        IOS_BUILD_NUMBER_OFFSET: "100"
      node: 22
      xcode: 26.5
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build native web bundle (Capacitor dist/)
        script: |
          # Uses committed .env.native (absolute https://fashionrise.app/api/v1).
          # Croquis notice texts must come from the fashionrise_native env group.
          export VITE_BUILD_SHA="${CM_COMMIT:0:8}"
          npm run build:native

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
          # Fail closed: committed Cap gitignore means native JSON is generated at sync.
          # Rewrite/assert contentInset never so TestFlight never double-pads under status bar.
          node scripts/assert-ios-capacitor-content-inset.mjs

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-set-ios-build-number.sh"
          "$CM_BUILD_DIR/scripts/codemagic-set-ios-build-number.sh"

      - name: Assert iOS AppIcon is real (not blank white)
        script: |
          # working_directory is web-ui — npm script resolves
          # web-ui/scripts/assert-ios-appicon.mjs (not repo-root scripts/).
          # Purchase sheet uses the compiled Xcode AppIcon asset catalog.
          # A solid-white 1024 PNG still "builds" but Apple shows a placeholder.
          # Fail closed: pixel scan via @napi-rs/canvas (from npm ci), sharp, or
          # Pillow — no size-only pass. Do not pip-install here; rely on npm ci.
          npm run check:ios-appicon

      - name: Build App Store IPA
        script: |
          cd "$CM_BUILD_DIR/web-ui/ios/App"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Verify single App.ipa + CFBundleVersion
        script: |
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-verify-ios-ipa.sh"
          # Do NOT copy App.ipa into CM_EXPORT_DIR or other staging dirs —
          # ASC publish discovers **/*.ipa and would upload duplicates (90189).
          "$CM_BUILD_DIR/scripts/codemagic-verify-ios-ipa.sh" \
            "$CM_BUILD_DIR/web-ui/ios/App/build/ios/ipa/App.ipa"

    artifacts:
      # Exactly ONE publishable IPA. Prefer the verified absolute original path.
      # Do not also list CM_EXPORT_DIR / staging copies (duplicate → 90189).
      - $CM_BUILD_DIR/web-ui/ios/App/build/ios/ipa/App.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # Upload IPA to App Store Connect only (TestFlight processing). No beta review,
    # no App Store review, no beta_groups — distribute manually in ASC if needed.
    # Docs: https://docs.codemagic.io/yaml-publishing/app-store-connect/
    # CLI publish default path is **/*.ipa — keep a single App.ipa on disk.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # ---------------------------------------------------------------------------
  # Manual iPad Simulator screenshots via Codemagic remote Mac + VNC (Windows OK).
  # Does NOT build/publish an IPA. Does NOT touch App Store Connect or IAP gates.
  # Operator docs: docs/deploy/IPAD-SCREENSHOTS-CODEMAGIC.md
  # ---------------------------------------------------------------------------
  fashionrise-ipad-screenshots:
    name: FashionRise iPad Screenshots
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: web-ui
    # No app_store_connect integration — screenshot session only.

    environment:
      groups:
        # Same croquis notice texts as native / production-gated builds.
        - fashionrise_native
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: app.fashionrise.studio
        # Bounded VNC hold after boot/install/launch (cancel early in Codemagic UI).
        FR_IPAD_SCREENSHOT_HOLD_MINUTES: "45"
        # Stable DerivedData so we can locate App.app without globbing ASC IPA paths.
        FR_SIM_DERIVED_DATA: /tmp/fr-ipad-sim-derived
      node: 22
      xcode: 26.5
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build native web bundle (Capacitor dist/)
        script: |
          # Production API via committed .env.native (https://fashionrise.app/api/v1).
          # Never print tokens / passwords. Croquis notices from fashionrise_native.
          export VITE_BUILD_SHA="${CM_COMMIT:0:8}"
          npm run build:native

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
          node scripts/assert-ios-capacitor-content-inset.mjs

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Assert iOS AppIcon is real (not blank white)
        script: |
          npm run check:ios-appicon

      - name: Assert iPhone+iPad device family preserved
        script: |
          # TARGETED_DEVICE_FAMILY must stay "1,2" (iPhone + iPad).
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' ios/App/App.xcodeproj/project.pbxproj

      - name: Build unsigned simulator .app
        script: |
          set -euo pipefail
          rm -rf "$FR_SIM_DERIVED_DATA"
          mkdir -p "$FR_SIM_DERIVED_DATA"
          cd "$CM_BUILD_DIR/web-ui/ios/App"
          # Prefer a 13-inch iPad destination when Xcode already knows one; build
          # still targets generic iOS Simulator SDK so install works on the
          # dynamically selected device below.
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$FR_SIM_DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH="$(find "$FR_SIM_DERIVED_DATA/Build/Products" -type d -name 'App.app' | head -n 1)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "FR_SIMULATOR_APP_PATH=$APP_PATH" >> "$CM_ENV"
          echo "Built simulator app at $APP_PATH"
          # Never print secrets from the bundle; only confirm Info.plist identity.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist"

      - name: Boot iPad, launch FashionRise, hold for VNC screenshots
        script: |
          set -euo pipefail
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-pick-ipad-simulator.sh"
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-ipad-screenshot.sh"
          chmod +x "$CM_BUILD_DIR/scripts/codemagic-ipad-screenshots-session.sh"
          export FR_IPAD_SCREENSHOT_DIR="$CM_BUILD_DIR/artifacts/ipad-screenshots"
          mkdir -p "$FR_IPAD_SCREENSHOT_DIR" "$CM_EXPORT_DIR/ipad-screenshots"
          "$CM_BUILD_DIR/scripts/codemagic-ipad-screenshots-session.sh"

    artifacts:
      # Screenshots (primary deliverable) + simulator .app for local debug if needed.
      - $CM_BUILD_DIR/artifacts/ipad-screenshots/*.png
      - $CM_EXPORT_DIR/ipad-screenshots/*.png
      - $CM_BUILD_DIR/artifacts/ipad-screenshots/**
      - /tmp/fr-ipad-sim-derived/Build/Products/**/*.app
      - /tmp/xcodebuild_logs/*.log
    # Explicitly no publishing: block — do not upload IPA / change ASC.
