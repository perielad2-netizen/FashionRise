# FashionRise API — Nginx reverse proxy (Ubuntu)
#
# Install:
#   sudo cp deploy/nginx_fashionrise.conf /etc/nginx/sites-available/fashionrise
#   sudo ln -sf /etc/nginx/sites-available/fashionrise /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace api.example.com everywhere below.
#
# SSL (Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.example.com
# Certbot will patch this file for 443. Ensure client_max_body_size is set for uploads.

upstream fashionrise_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Allow larger image uploads (align with MAX_UPLOAD_SIZE_MB + headroom)
    client_max_body_size 30M;

    # Optional: serve uploads directly from disk (same path as LOCAL_STORAGE_ROOT/uploads).
    # Then set PUBLIC_UPLOAD_BASE_URL=https://api.example.com/static/uploads
    # and ensure www-data can read /var/lib/fashionrise/storage/uploads or use ACLs.
    #
    # location /static/uploads/ {
    #     alias /var/lib/fashionrise/storage/uploads/;
    #     add_header Cache-Control "public, max-age=86400";
    # }

    location / {
        proxy_pass http://fashionrise_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

# After Certbot, you will have a second server { listen 443 ssl; ... } block
# with the same proxy settings. Copy client_max_body_size and location blocks there if needed.
